# Per-tool policy for MCP tool calls (#923 option 1).
#
# The bash rules match shell command strings; an MCP call is a name plus a JSON
# object, so coverage does not transfer — a tool is classified HERE instead.
# First match wins. Fields: `tool` (exact full name) or `match` (regex on the
# name), `tier` (allow | ask | block; default ask), `mutates` (screen protected
# control-plane path arguments; defaults true for any non-allow tier), `id`
# (stable — `unattended_allow` / `disabled_rules` name it), `reason`.
#
# Tier semantics are the Bash hook's, unchanged: `ask` is an interactive
# confirm, demoted to allow under bypassPermissions/auto, and FAIL-CLOSED
# (block + owner email) in an unattended session unless the id is granted.
# A tool call names no directory, so a path-scoped grant refuses — grant these
# ids unscoped, per task, deliberately.
#
# WHAT IS CLASSIFIED HERE: only the fallback entry below. Tools of one application
# (a session manager's kill/remove/teardown class, say) are classified by that
# application's own pack, which sorts before this file so its entries win.
#
# WHAT IS DELIBERATELY NOT CLASSIFIED: a tool whose effect is a message to a
# session that runs its own damage control, and everything read-shaped or
# additive (create/list/status/output) — those fall through to allow, with
# zero-access secret screening still applied to every tool's path arguments.
#
# UNCLASSIFIED TOOLS fall through to the final name-shape entry below (the
# #1036 heuristic, now data a host can edit) and otherwise to allow-with-
# screening. That default is the design decision #923 names: fail-closed would
# kill every third-party tool and every future tool until classified.

mcpToolPolicies:
  # --- fallback for unclassified tools --------------------------------------
  # The #1036 write-shaped-name heuristic, kept as DATA rather than code: a
  # tool whose name declares a mutating operation gets its path-valued
  # arguments screened against the protected control plane. `allow` tier — the
  # name shape alone never blocks or asks; only a protected path argument does.
  - match: "(write|edit|delete|remove|move|rename|create|append|patch|mkdir|rmdir|copy|upload|chmod|prune|kill|purge)"
    id: mcp.writeish-name
    tier: allow
    mutates: true
    reason: write-shaped MCP tool name — protected control-plane path arguments are refused
