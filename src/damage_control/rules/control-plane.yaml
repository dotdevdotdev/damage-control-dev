# Damage-control control plane (#466)
#
# These are the files that DEFINE damage control — its kill switch, its rules,
# and its own hook registration. If the policed agent could write them it could
# disable safety, act, and re-enable, bypassing everything.
#
# The REAL guarantee lives in code: ``check_protected_command`` /
# ``check_protected_path`` in ``engine.py`` block writes to
# these paths BEFORE the ``# allow:`` escape hatch and BEFORE the kill switch,
# so neither can override them. Only the user's ``allowedPaths`` allowlist (a
# host-side opt-in) re-permits a path.
#
# Listing them here as ``readOnlyPaths`` too is defense-in-depth + visibility
# (they show up in ``status`` rule counts). The readOnly tier
# is escape-hatch-bypassable on its own — the code-level check is what makes the
# protection absolute.

readOnlyPaths:
  - "*.damagecontrol.yml"
  - "~/.claude/settings.json"
  - "~/.claude/hooks/*"

# A nested `claude` run loads its own hooks. Options that remove them (or an environment variable that
# moves the config that holds them) give a child that runs every tool call with no damage control. The
# engine reads the argv (damage_control/claudeops.py) and hands these rules a canonical command
# `claude --dc:<operation>`, so abbreviations, `--opt=value`, launchers and wrappers all land here.
# Anchored: text that only mentions a flag (a commit message, an echo) is not a command.
bashToolPatterns:
  - id: control-plane.claude-nested-bare
    pattern: '\bclaude\s+--dc:bare\b'
    reason: a nested claude run with --bare loads no hooks, so the guard does not apply to it
    anchored: true

  - id: control-plane.claude-nested-safe-mode
    pattern: '\bclaude\s+--dc:safe-mode\b'
    reason: a nested claude run with --safe-mode loads no hooks, so the guard does not apply to it
    anchored: true

  - id: control-plane.claude-nested-disable-all-hooks
    pattern: '\bclaude\s+--dc:disable-all-hooks\b'
    reason: a nested claude run whose --settings sets disableAllHooks loads no hooks, so the guard does not apply to it
    anchored: true

  - id: control-plane.claude-nested-no-user-scope
    pattern: '\bclaude\s+--dc:no-user-scope\b'
    reason: a nested claude run whose --setting-sources leaves out the user scope does not load the guard registered there
    anchored: true

  - id: control-plane.claude-nested-partial-sources
    pattern: '\bclaude\s+--dc:partial-sources\b'
    reason: a nested claude run whose --setting-sources leaves out the project or local scope may not load a guard registered there
    ask: true
    anchored: true

  - id: control-plane.claude-nested-settings-file
    pattern: '\bclaude\s+--dc:settings-file\b'
    reason: a nested claude run with --settings loads settings the engine cannot read, which may remove hooks
    ask: true
    anchored: true

  - id: control-plane.claude-nested-plugin-dir
    pattern: '\bclaude\s+--dc:plugin-dir\b'
    reason: a nested claude run with --plugin-dir loads hooks and settings from a directory the engine cannot read
    ask: true
    anchored: true

  - id: control-plane.claude-nested-config-dir
    pattern: '\bclaude\s+--dc:config-dir\b'
    reason: a nested claude run with CLAUDE_CONFIG_DIR set reads its settings and hooks from another directory
    ask: true
    anchored: true
