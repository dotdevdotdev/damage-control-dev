name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Internal Markdown links resolve
        run: python tools/check_links.py
      - name: docs/coverage.md is up to date with the code
        run: |
          python -m pip install .
          python tools/coverage_matrix.py --check
      - name: No host-specific text or dangling issue numbers in the docs
        run: |
          if grep -rniE 'agentwire|#[0-9]{3,}|\b(secure|safe)\b' docs/threat-model.md docs/rule-authoring.md docs/coverage.md docs/index.md docs/sandbox.md; then exit 1; fi
          # extending.md may name AgentWire once, in its labelled example section
          test "$(grep -ci agentwire docs/extending.md)" -le 3
          if grep -nE '#[0-9]{3,}' docs/extending.md; then exit 1; fi

  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
      - name: Rules JSON is in sync with the YAML sources
        if: matrix.python == '3.12'
        run: |
          python -m pip install pyyaml
          python tools/build_rules_json.py src/damage_control/rules src/damage_control/tooldefs
          git diff --exit-code -- src/damage_control
      - name: Tests
        run: |
          python -m pip install pytest pyyaml
          python -m pytest tests -q
      - name: Hook blocks a destructive command and allows a harmless one
        run: |
          echo '{"tool_name":"Bash","tool_input":{"command":"ls"},"cwd":"/tmp"}' | python -I -m damage_control.hook bash
          rc=0
          echo '{"tool_name":"Bash","tool_input":{"command":"rm -rf /"},"cwd":"/tmp"}' | python -I -m damage_control.hook bash || rc=$?
          test "$rc" -eq 2
