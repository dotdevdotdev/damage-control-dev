name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
      - name: Rules JSON is in sync with the YAML sources
        if: matrix.python == '3.12'
        run: |
          python -m pip install pyyaml
          python tools/build_rules_json.py src/damage_control/rules src/damage_control/tooldefs
          git diff --exit-code -- src/damage_control
      - name: Hook blocks a destructive command and allows a harmless one
        run: |
          echo '{"tool_name":"Bash","tool_input":{"command":"ls"},"cwd":"/tmp"}' | python -I -m damage_control.hook bash; test $? -eq 0
          echo '{"tool_name":"Bash","tool_input":{"command":"rm -rf /"},"cwd":"/tmp"}' | python -I -m damage_control.hook bash; test $? -ne 0
