name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Internal Markdown links resolve
        run: python tools/check_links.py
      - name: docs/coverage.md is up to date with the code
        run: |
          python -m pip install .
          python tools/coverage_matrix.py --check
      - name: docs/conformance.md is up to date with the corpus
        run: python tools/conformance_doc.py --check
      - name: Every conformance row gets its recorded verdict from the real hook
        run: damage-control-dev corpus run
      - name: No host-specific text or dangling issue numbers in the docs
        run: |
          # --safe-mode is claude's flag, not a claim; every other hit fails
          if grep -rniE 'agentwire|#[0-9]{3,}|\b(secure|safe)\b' docs/threat-model.md docs/coverage.md docs/sandbox.md | grep -v -e '--safe-mode'; then exit 1; fi
          if grep -rniE '#[0-9]{3,}|\b(secure|safe)\b' docs/rule-authoring.md docs/index.md docs/conformance.md | grep -v -e '--safe-mode'; then exit 1; fi
          # The optional pack is named only where it is legitimately listed: its own page, one row of
          # index.md, the packs line of rule-authoring.md, and conformance.md's generated pack-* sections.
          if grep -rliE 'agentwire' docs | grep -vE '^docs/(agentwire-pack|index|rule-authoring|extending|conformance)\.md$'; then exit 1; fi
          test "$(grep -ci agentwire docs/index.md)" -le 1
          test "$(grep -ci agentwire docs/rule-authoring.md)" -le 1
          # conformance.md: everything outside the pack-* class rows and their sections
          if awk '/^## pack-/{skip=1; next} /^## /{skip=0} !skip && !/^\| \[pack-/' docs/conformance.md | grep -niE 'agentwire'; then exit 1; fi
          # extending.md may name the pack in its labelled section only
          test "$(grep -ci agentwire docs/extending.md)" -le 3
          if grep -nE '#[0-9]{3,}' docs/extending.md; then exit 1; fi

  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
      - name: Rules JSON is in sync with the YAML sources
        if: matrix.python == '3.12'
        run: |
          python -m pip install pyyaml
          python tools/build_rules_json.py src/damage_control/rules src/damage_control/tooldefs
          git diff --exit-code -- src/damage_control
      - name: Tests
        run: |
          python -m pip install pytest pyyaml
          python -m pytest tests -q
      - name: Hook blocks a destructive command and allows a harmless one
        run: |
          echo '{"tool_name":"Bash","tool_input":{"command":"ls"},"cwd":"/tmp"}' | python -I -m damage_control.hook bash
          rc=0
          echo '{"tool_name":"Bash","tool_input":{"command":"rm -rf /"},"cwd":"/tmp"}' | python -I -m damage_control.hook bash || rc=$?
          test "$rc" -eq 2
